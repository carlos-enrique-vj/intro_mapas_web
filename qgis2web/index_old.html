        /* ============================================================
           Monitor RNC 2025 - Región Yucatán
           Capa visual institucional (guinda / gris ejecutivo)
           ============================================================ */
        :root{
            --guinda-900:#450e1b;
            --guinda-800:#571323;
            --guinda-700:#6d1a2d;
            --guinda-600:#8c2338;
            --gris-900:#1f2328;
            --gris-700:#3d434a;
            --gris-500:#6b7280;
            --borde:#e4e7ec;
            --fondo:#f4f5f7;
        }
        html, body{
            height:100%;
            margin:0;
            padding:0;
            overflow:hidden;
        }
        body{
            font-family:'Inter', -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            background:var(--fondo);
            color:var(--gris-900);
        }
        /* ---------- Header institucional fijo ---------- */
        #app-header{
            position:fixed;
            top:0; left:0; right:0;
            height:58px;
            z-index:1000;
            display:flex;
            align-items:center;
            gap:14px;
            padding:0 20px;
            background:linear-gradient(90deg, var(--guinda-900) 0%, var(--guinda-700) 55%, #33222a 100%);
            color:#fff;
            box-shadow:0 2px 14px rgba(0,0,0,.35);
            border-bottom:3px solid var(--guinda-600);
        }
        #app-header .logo-badge{
            flex:0 0 auto;
            width:38px; height:38px;
            border-radius:10px;
            background:rgba(255,255,255,.12);
            border:1px solid rgba(255,255,255,.25);
            display:flex; align-items:center; justify-content:center;
            font-size:17px; color:#fff;
        }
        #app-header .titulos{
            display:flex; flex-direction:column; line-height:1.2; min-width:0;
        }
        #app-header h1{
            font-size:15.5px; font-weight:700; margin:0;
            letter-spacing:.2px;
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
        }
        #app-header .sub{
            font-size:10.5px; font-weight:500;
            color:rgba(255,255,255,.72);
            letter-spacing:.6px; text-transform:uppercase;
        }
        #app-header .spacer{ flex:1; }
        #app-header .meta-pill{
            font-size:11px; font-weight:600;
            background:rgba(255,255,255,.14);
            border:1px solid rgba(255,255,255,.24);
            padding:5px 12px; border-radius:999px;
            white-space:nowrap;
        }
        /* ---------- Mapa a pantalla completa bajo el header ---------- */
        #map{
            position:absolute;
            top:58px; left:0; right:0; bottom:0;
            width:auto; height:auto;
            font-family:'Inter', sans-serif;
        }
        /* ---------- Controles tipo tarjeta (zoom, geolocalizar, medir) ---------- */
        .leaflet-bar{
            border:none !important;
            box-shadow:0 4px 14px rgba(16,24,40,.18) !important;
            border-radius:10px !important;
            overflow:hidden;
        }
        .leaflet-bar a{
            background:#fff !important;
            color:var(--gris-700) !important;
            width:34px; height:34px; line-height:34px;
            font-size:15px;
            border-bottom:1px solid var(--borde) !important;
            transition:all .18s ease;
        }
        .leaflet-bar a:last-child{ border-bottom:none !important; }
        .leaflet-bar a:hover{
            background:var(--guinda-700) !important;
            color:#fff !important;
        }
        .leaflet-bar a.leaflet-disabled{
            background:#f2f3f5 !important;
            color:#b9bfc7 !important;
        }
        .leaflet-control-locate a,
        .leaflet-control-measure .leaflet-control-measure-toggle{
            width:34px; height:34px; line-height:34px;
            font-size:14px;
        }
        .leaflet-control-locate a{
            border-radius:10px !important;
            box-shadow:0 4px 14px rgba(16,24,40,.18);
        }
        .leaflet-control-measure{
            background:#fff;
            border-radius:10px !important;
            box-shadow:0 4px 14px rgba(16,24,40,.18) !important;
            overflow:hidden;
        }
        .leaflet-control-measure .leaflet-control-measure-toggle{
            padding:0; text-align:center; color:var(--gris-700);
            transition:all .18s ease;
        }
        .leaflet-control-measure .leaflet-control-measure-toggle:hover{
            background:var(--guinda-700) !important; color:#fff;
        }
        /* ---------- Control de Capas (layers tree) ---------- */
        .leaflet-control-layers{
            background:#fff;
            border:none !important;
            border-radius:14px !important;
            box-shadow:0 8px 26px rgba(16,24,40,.16) !important;
            overflow:hidden;
        }
        .leaflet-control-layers-expanded{
            padding:12px 14px;
            max-height:calc(100vh - 150px);
        }
        .leaflet-control-layers-toggle{
            width:36px !important; height:36px !important;
            border-radius:10px !important;
        }
        .leaflet-control-layers-list{
            font-family:'Inter', sans-serif;
            color:var(--gris-700);
        }
        .leaflet-control-layers-tree{
            margin:2px 4px;

        }
        .leaflet-layerstree-header{

        }
        .leaflet-layerstree-header:hover{ background:#f8f4f5; }
        .leaflet-layerstree-header label{

        .leaflet-layerstree-header-pointer{ color:var(--guinda-700); }
        .leaflet-layerstree-children{ border-left:2px solid #efe5e8; margin-left:6px; }
        .leaflet-control-layers-selector{
            accent-color:var(--guinda-700);

            cursor:pointer;
        }
        .leaflet-control-layers-tree input[type="radio"]{

        }
        /* Leyenda dentro del control */
        .leaflet-control-layers-tree table{
            border-collapse:collapse;
            font-size:11.5px;
            margin:4px 0 6px 2px;
        }
        .leaflet-control-layers-tree td{
            padding:2px 5px;
            color:var(--gris-700);
        }
        .leaflet-control-layers-tree td img{
            vertical-align:middle;
            border-radius:2px;
        }
        /* Scrollbar del panel de capas */
        .leaflet-control-layers-scrollbar{
            scrollbar-width:thin;
            scrollbar-color:var(--guinda-700) #eceff3;
        }
        .leaflet-control-layers-scrollbar::-webkit-scrollbar{ width:6px; }
        .leaflet-control-layers-scrollbar::-webkit-scrollbar-thumb{

        }
        .leaflet-control-layers-scrollbar::-webkit-scrollbar-track{ background:#eceff3; }
        /* ---------- Buscador (Photon) ---------- */
        .leaflet-control-search{
            background:#fff !important;
            border-radius:10px !important;
            box-shadow:0 4px 14px rgba(16,24,40,.18) !important;
            align-items:center;

        }

            padding:0;

        .leaflet-popup-content{
            margin:14px 18px;
            font-family:'Inter', sans-serif;
            font-size:13px;
            line-height:1.5;
            color:var(--gris-900);
            min-width:190px;
        }
        .leaflet-popup-content table{
            width:100%;
            border-collapse:collapse;
            font-size:12.5px;
        }
        .leaflet-popup-content th{
            background:#f6f3f4;
            color:var(--guinda-800);
            text-align:left;
            font-weight:600;
            font-size:10.5px;
            text-transform:uppercase;
            letter-spacing:.5px;
            padding:6px 10px;
            border:1px solid var(--borde);
        }
        .leaflet-popup-content td{
            padding:6px 10px;
            border:1px solid var(--borde);
            color:var(--gris-700);
        }
        .leaflet-popup-content tr:nth-child(even) td{ background:#fafbfc; }
        .leaflet-popup-content td strong{ color:var(--gris-900); }
        .leaflet-popup-content a{
            color:var(--guinda-600);
            font-weight:600;
            text-decoration:none;
        }
        .leaflet-popup-content a:hover{ text-decoration:underline; }
        .leaflet-popup-tip{
            box-shadow:0 3px 10px rgba(16,24,40,.15);

        }
        .leaflet-popup-close-button{
            color:var(--gris-500) !important;
            font-size:18px !important;

        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }
